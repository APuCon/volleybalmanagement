<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#142138"><link rel="manifest" href="./manifest.webmanifest"><title>Volleybal Tracker</title><style>
:root{--navy:#142138;--panel:#1c2c49;--light:#24365a;--line:#cfd6e4;--dim:#8c97ae;--orange:#e2933c;--red:#c15646}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse 900px 500px at 50% -10%,#1e304f 0,var(--navy) 60%);color:var(--line);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;min-height:100vh}button,input,select{font:inherit}button{border:0;cursor:pointer}.wrap{max-width:520px;margin:auto;padding:16px}.header{border-bottom:1px solid #ffffff14;padding:18px 16px}.head{max-width:520px;margin:auto;display:flex;justify-content:space-between;align-items:end;gap:12px}.eyebrow,.muted{color:var(--dim);font-size:12px}.title{font-size:21px;margin:4px 0 0}.tally{font-weight:800;font-size:25px}.tally b:first-child{color:var(--orange)}.tally b:last-child{color:var(--red)}.card,.sync{background:var(--panel);border:1px solid #ffffff10;border-radius:14px;padding:18px;margin-bottom:14px}.card h2{margin:0 0 6px;font-size:19px}.label{display:block;color:var(--dim);font-size:12px;margin:12px 0 5px}.input{width:100%;background:var(--light);border:1px solid #ffffff18;color:var(--line);padding:10px;border-radius:8px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.btn{width:100%;padding:12px;border-radius:9px;font-weight:700;margin-top:14px;background:var(--orange);color:#1a1206}.btn2{background:var(--light);color:var(--line);border:1px solid #ffffff20}.danger{background:#c1564628;color:#f0b9b0;border:1px solid #c156467a}.sync{padding:12px}.synchead{display:flex;justify-content:space-between}.syncactions{display:flex;gap:7px}.syncactions button{flex:1;padding:9px;border-radius:8px;font-size:11px;margin-top:8px}.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center}.score .num{font-size:46px;font-weight:800}.us{color:var(--orange)}.opp{color:var(--red)}.court{margin:14px 0;background:var(--light);border-radius:10px;padding:10px}.net{text-align:center;color:var(--dim);border-bottom:2px dashed var(--dim);padding-bottom:5px;margin-bottom:8px}.courtgrid{position:relative;height:330px;border:1px solid #ffffff18;border-radius:8px;background:linear-gradient(180deg,#ffffff05,#ffffff01)}.player{background:#142138e8;border:1px solid #ffffff22;border-radius:6px;padding:3px;text-align:center;position:absolute;transform:translate(-50%,-50%);width:20%;min-width:58px;max-width:82px;box-shadow:0 2px 8px #0003;overflow:hidden}.player-meta{font-size:8px;line-height:1.05;color:var(--dim);font-weight:600;white-space:nowrap}.player-name{font-size:10px;line-height:1.1;font-weight:700;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.role{font-size:10px;color:var(--dim)}.name{font-weight:700;margin-top:3px;overflow:hidden;text-overflow:ellipsis}.pointbtn{padding:16px;color:white;border-radius:10px;font-weight:800;width:100%;margin-top:9px}.history{margin-top:14px;border:1px solid #ffffff12;border-radius:10px;overflow:hidden}.history summary{padding:11px;background:var(--light);font-weight:700;cursor:pointer}.row{display:flex;justify-content:space-between;gap:10px;padding:9px 11px;border-top:1px solid #ffffff0e}.small{font-size:11px;color:var(--dim)}.stats{overflow-x:auto}.stats table{width:100%;border-collapse:collapse;min-width:480px;font-size:12px}.stats th,.stats td{padding:8px 6px;border-bottom:1px solid #ffffff12;text-align:right}.stats th:first-child,.stats td:first-child{text-align:left}.status-ok{color:#8fd0a5}.status-err{color:#f0b9b0}.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1;padding:10px;border-radius:8px;background:var(--light);color:var(--line)}@media(max-width:420px){.grid2{grid-template-columns:1fr}.syncactions{flex-wrap:wrap}.syncactions button{min-width:45%}}
</style></head><body><header class="header"><div class="head"><div><div class="eyebrow">Volleybal · 5-1 systeem · 4 sets, beslissende 5e bij 2-2</div><h1 class="title" id="headline">Volleybal Tracker</h1></div><div class="tally" id="tally"></div></div></header><div class="wrap"><div id="sync"></div><div class="tabs"><button onclick="showScreen('match')">Wedstrijd</button><button onclick="showScreen('stats')">Spelershistorie</button></div><main id="app"></main></div><script>
const VISUAL={
'us':{
1:{setter:[84,76],buiten1:[84,18],midden1:[50,18],dia:[16,18],buiten2:[16,76],midden2:[50,76]},
2:{setter:[50,76],buiten1:[84,76],midden1:[84,18],dia:[50,18],buiten2:[16,18],midden2:[16,76]},
3:{setter:[16,76],buiten1:[50,76],midden1:[84,76],dia:[84,18],buiten2:[50,18],midden2:[16,18]},
4:{setter:[16,18],buiten1:[16,76],midden1:[50,76],dia:[84,76],buiten2:[84,18],midden2:[50,18]},
5:{setter:[50,18],buiten1:[16,18],midden1:[16,76],dia:[50,76],buiten2:[84,76],midden2:[84,18]},
6:{setter:[84,18],buiten1:[50,18],midden1:[16,18],dia:[16,76],buiten2:[50,76],midden2:[84,76]}},
'opponent':{
1:{setter:[88,62],buiten1:[77,48],midden1:[48,18],dia:[16,34],buiten2:[16,80],midden2:[48,80]},
2:{setter:[50,18],buiten1:[78,80],midden1:[75,40],dia:[55,10],buiten2:[18,78],midden2:[48,90]},
3:{setter:[44,35],buiten1:[50,90],midden1:[78,78],dia:[85,18],buiten2:[24,72],midden2:[16,18]},
4:{setter:[8,10],buiten1:[18,76],midden1:[70,76],dia:[87,90],buiten2:[47,76],midden2:[8,18]},
5:{setter:[50,18],buiten1:[25,63],midden1:[50,75],dia:[58,90],buiten2:[72,70],midden2:[78,35]},
6:{setter:[70,8],buiten1:[15,65],midden1:[8,20],dia:[35,90],buiten2:[50,80],midden2:[80,80]}}
};
const ROLES=['setter','dia','midden1','midden2','buiten1','buiten2'];const LABEL={setter:'Setter',dia:'Diagonaal',midden1:'Midden 1',midden2:'Midden 2',buiten1:'Buiten 1',buiten2:'Buiten 2'};const SEQ=['setter','buiten1','midden1','dia','buiten2','midden2'];const STORE='vb-match-v5',STATS='vb-stats-v5',SYNC='vb-sync-v1',PENDING='vb-pending-v1';
const emptyPlayers=()=>Object.fromEntries(ROLES.map(r=>[r,'']));const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);function newSet(n,prev){return{number:n,players:prev?{...prev.players}:emptyPlayers(),reserves:prev?[...prev.reserves]:['','','',''],absentees:prev?[...prev.absentees]:['','','',''],startRole:prev?prev.startRole:'setter',initialServer:'us',rotation:1,serving:'us',score:{us:0,opponent:0},history:[],recorded:false,completed:false,winner:null}}
let state=JSON.parse(localStorage.getItem(STORE)||'null')||{team:'',opponent:'',phase:'setup',sets:[],setIndex:0,matchId:'',screen:'match'};let stats=JSON.parse(localStorage.getItem(STATS)||'{}');let syncMsg='Alleen lokaal',syncKind='';const setNow=()=>state.sets[state.setIndex];const wins=w=>state.sets.filter(s=>s.completed&&s.winner===w).length;const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
function persist(){localStorage.setItem(STORE,JSON.stringify(state));localStorage.setItem(STATS,JSON.stringify(stats));scheduleSync()}
function showScreen(x){state.screen=x;persist();render()}
function startMatch(){let t=document.querySelector('#team').value.trim(),o=document.querySelector('#opponent').value.trim();if(!t||!o)return alert('Vul beide teamnamen in.');state={team:t,opponent:o,phase:'lineup',sets:[newSet(1)],setIndex:0,matchId:'m-'+uid(),screen:'match'};persist();render()}
function readLineup(){let s=setNow();ROLES.forEach(r=>s.players[r]=document.querySelector('#p-'+r).value.trim());s.reserves=[0,1,2,3].map(i=>document.querySelector('#r-'+i).value.trim());s.absentees=[0,1,2,3].map(i=>document.querySelector('#a-'+i).value.trim());s.startRole=document.querySelector('#startRole').value;s.initialServer=document.querySelector('#server').value}
function addStat(name,type,setNo){name=name.trim();if(!name)return;let k=name.toLocaleLowerCase('nl-NL');if(!stats[k])stats[k]={name,reserveSets:0,reserveMatches:0,absentSets:0,absentMatches:0,seen:{}};let r=stats[k],sk=state.matchId+':s'+setNo+':'+type,mk=state.matchId+':m:'+type;if(!r.seen[sk]){r.seen[sk]=1;r[type+'Sets']++}if(!r.seen[mk]){r.seen[mk]=1;r[type+'Matches']++}}
function confirmLineup(){readLineup();let s=setNow();if(ROLES.some(r=>!s.players[r]))return alert('Vul alle zes basisspelers in.');if(!s.recorded){let seen={};s.reserves.forEach(n=>{let k=n.toLowerCase();if(k&&!seen['r'+k]){seen['r'+k]=1;addStat(n,'reserve',s.number)}});s.absentees.forEach(n=>{let k=n.toLowerCase();if(k&&!seen['a'+k]){seen['a'+k]=1;addStat(n,'absent',s.number)}});s.recorded=true}s.rotation=SEQ.indexOf(s.startRole)+1;s.serving=s.initialServer;state.phase='live';persist();render()}
function setWinner(score,decider){let target=decider?15:25;return(score.us>=target||score.opponent>=target)&&Math.abs(score.us-score.opponent)>=2?(score.us>score.opponent?'us':'opponent'):null}
function point(w){let s=setNow();let before={score:{...s.score},serving:s.serving,rotation:s.rotation};s.score[w]++;let changed=w!==s.serving,rotated=false;if(changed){s.serving=w;if(w==='us'){s.rotation=s.rotation%6+1;rotated=true}}s.history.push({...before,point:{winner:w,scoreAfter:{...s.score},changed,rotated,time:new Date().toISOString()}});let win=setWinner(s.score,state.setIndex===4);if(win){s.completed=true;s.winner=win;state.phase='setover'}persist();render()}
function undo(){let s=setNow(),x=s.history.pop();if(!x)return;s.score=x.score;s.serving=x.serving;s.rotation=x.rotation;s.completed=false;s.winner=null;state.phase='live';persist();render()}
function nextSet(){let played=state.sets.length;if(played<4){let p=setNow();state.sets.push(newSet(p.number+1,p));state.setIndex++;state.phase='lineup'}else if(played===4&&wins('us')===2&&wins('opponent')===2){let p=setNow();state.sets.push(newSet(5,p));state.setIndex++;state.phase='lineup'}else{state.phase='matchover'}persist();render()}
function resetMatch(){if(!confirm('Weet je zeker dat je de huidige wedstrijd wilt afbreken en een nieuwe wilt starten? Spelershistorie en cloudkoppeling blijven bewaard.'))return;state={team:'',opponent:'',phase:'setup',sets:[],setIndex:0,matchId:'',screen:'match'};persist();render()}
function positionOf(role,rotation){return((SEQ.indexOf(role)-rotation+1+6)%6)+1}
function history(s){let rows=[...s.history].reverse().map((x,ri)=>{let i=s.history.length-ri,e=x.point||{},n=e.winner==='us'?state.team:state.opponent,sc=e.scoreAfter||s.score,d=e.rotated?'Service overgenomen, rotatie':e.changed?'Servicewissel':'Service behouden';return`<div class="row"><div><b>Punt ${i}: ${esc(n)}</b><div class="small">${d} · ${e.time?new Date(e.time).toLocaleTimeString('nl-NL'):''}</div></div><b>${sc.us}-${sc.opponent}</b></div>`}).join('')||'<div class="row muted">Nog geen punten.</div>';return`<details class="history"><summary>Puntenhistorie set ${s.number} · ${s.history.length} punten</summary>${rows}</details>`}
function lineup(){let s=setNow();return`<section class="card"><h2>Opstelling set ${s.number} van maximaal 5</h2><p class="muted">Er worden altijd vier sets gespeeld. Alleen bij een stand van 2-2 volgt een beslissende vijfde set tot 15 punten, met twee punten verschil.</p><div class="grid2">${ROLES.map(r=>`<div><label class="label">${LABEL[r]}</label><input class="input" id="p-${r}" value="${esc(s.players[r])}"></div>`).join('')}</div><h2 style="margin-top:22px">Reserves en afwezigen</h2><p class="muted">Maximaal vier per categorie. Lege velden worden genegeerd. De telling wordt vastgelegd zodra de set wordt gestart.</p><div class="grid2">${[0,1,2,3].map(i=>`<div><label class="label">Reserve ${i+1}</label><input class="input" id="r-${i}" value="${esc(s.reserves[i]||'')}"></div>`).join('')}${[0,1,2,3].map(i=>`<div><label class="label">Afwezige ${i+1}</label><input class="input" id="a-${i}" value="${esc(s.absentees[i]||'')}"></div>`).join('')}</div><label class="label">Startrol positie 1</label><select class="input" id="startRole">${ROLES.map(r=>`<option value="${r}" ${s.startRole===r?'selected':''}>${LABEL[r]}</option>`).join('')}</select><label class="label">Eerste service</label><select class="input" id="server"><option value="us">${esc(state.team)}</option><option value="opponent" ${s.initialServer==='opponent'?'selected':''}>${esc(state.opponent)}</option></select><button class="btn" onclick="confirmLineup()">Set beginnen</button></section>`}
function live(){let s=setNow(),layout=VISUAL[s.serving][s.rotation];return`<section class="card"><div class="score"><div><div class="muted">${esc(state.team)}</div><div class="num us">${s.score.us}</div></div><div>set ${s.number}<div class="small">tot ${s.number===5?15:25}</div></div><div><div class="muted">${esc(state.opponent)}</div><div class="num opp">${s.score.opponent}</div></div></div><div class="muted" style="text-align:center;margin:8px">${esc(s.serving==='us'?state.team:state.opponent)} serveert · rotatie ${s.rotation}</div><div class="court"><div class="net">net</div><div class="courtgrid">${ROLES.map(role=>{let xy=layout[role],name=s.players[role]||'—';let pos=positionOf(role,s.rotation);return`<div class="player" style="left:${xy[0]}%;top:${xy[1]}%"><div class="player-meta">Pos ${pos} · ${LABEL[role]}</div><div class="player-name">${esc(name)}</div></div>`}).join('')}</div></div><button class="pointbtn" style="background:var(--orange)" onclick="point('us')">Punt voor ${esc(state.team)}</button><button class="pointbtn" style="background:var(--red)" onclick="point('opponent')">Punt voor ${esc(state.opponent)}</button><button class="btn btn2" onclick="undo()">Laatste punt ongedaan maken</button>${history(s)}</section>`}
function statsView(){let a=Object.values(stats).sort((x,y)=>x.name.localeCompare(y.name,'nl'));return`<section class="card"><h2>Spelershistorie</h2><p class="muted">Cumulatief over alle lokaal en via de cloud gesynchroniseerde wedstrijden.</p><div class="stats"><table><thead><tr><th>Speler</th><th>Reserve sets</th><th>Reserve wedstrijden</th><th>Afwezig sets</th><th>Afwezig wedstrijden</th></tr></thead><tbody>${a.map(r=>`<tr><td>${esc(r.name)}</td><td>${r.reserveSets||0}</td><td>${r.reserveMatches||0}</td><td>${r.absentSets||0}</td><td>${r.absentMatches||0}</td></tr>`).join('')}</tbody></table></div><button class="btn btn2" onclick="exportCsv()">Export naar CSV</button></section>`}
function exportCsv(){let rows=[['Speler','Reserve sets','Reserve wedstrijden','Afwezig sets','Afwezig wedstrijden'],...Object.values(stats).map(r=>[r.name,r.reserveSets||0,r.reserveMatches||0,r.absentSets||0,r.absentMatches||0])],csv='\ufeff'+rows.map(a=>a.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\r\n'),u=URL.createObjectURL(new Blob([csv],{type:'text/csv'})),a=document.createElement('a');a.href=u;a.download='volleybal-spelershistorie.csv';a.click();URL.revokeObjectURL(u)}
function abortButtonHtml(){return state.phase==='setup'?'':`<button class="btn btn2 danger" onclick="resetMatch()">Wedstrijd afbreken en nieuwe starten</button>`}
function render(){document.querySelector('#headline').innerHTML=state.team?`${esc(state.team)} <span class="muted">tegen</span> ${esc(state.opponent)}`:'Volleybal Tracker';document.querySelector('#tally').innerHTML=state.sets.length?`<b>${wins('us')}</b> – <b>${wins('opponent')}</b>`:'';document.querySelector('#sync').innerHTML=syncHtml();let a=document.querySelector('#app');if(state.screen==='stats'){a.innerHTML=statsView()+abortButtonHtml();return}if(state.phase==='setup')a.innerHTML=`<section class="card"><h2>Nieuwe wedstrijd</h2><label class="label">Jouw team</label><input class="input" id="team"><label class="label">Tegenstander</label><input class="input" id="opponent"><button class="btn" onclick="startMatch()">Wedstrijd starten</button></section>`;else if(state.phase==='lineup')a.innerHTML=lineup();else if(state.phase==='live')a.innerHTML=live();else if(state.phase==='setover'){let s=setNow();a.innerHTML=`<section class="card"><h2>Set ${s.number} gewonnen door ${esc(s.winner==='us'?state.team:state.opponent)}</h2><p>Eindstand ${s.score.us}-${s.score.opponent}. Stand in sets ${wins('us')}-${wins('opponent')}.</p>${history(s)}<button class="btn" onclick="nextSet()">${s.number>=5||(s.number===4&&!(wins('us')===2&&wins('opponent')===2))?'Wedstrijd afronden':'Volgende set voorbereiden'}</button></section>`}else a.innerHTML=`<section class="card"><h2>${esc(wins('us')>wins('opponent')?state.team:state.opponent)} wint de wedstrijd</h2><p>Eindstand in sets ${wins('us')}-${wins('opponent')}</p>${state.sets.map(history).join('')}<button class="btn" onclick="resetMatch()">Nieuwe wedstrijd</button></section>`;a.innerHTML+=abortButtonHtml()}
// Cloud synchronization
let timer;function cfg(){try{return JSON.parse(localStorage.getItem(SYNC)||'null')}catch{return null}}function bundle(){return{updatedAt:new Date().toISOString(),match:state,stats}}function syncHtml(){let c=cfg()||{};return`<section class="sync"><div class="synchead"><b>Cloudsynchronisatie</b><span id="syncstatus" class="small ${syncKind}">${esc(syncMsg)}</span></div><div class="grid2"><input class="input" id="syncTeam" placeholder="Team-ID" value="${esc(c.teamId||'')}"><input class="input" type="password" id="syncKey" placeholder="Synchronisatiecode" value="${esc(c.key||'')}"></div><div class="syncactions"><button class="btn2" onclick="connectSync()">Koppelen / ophalen</button><button class="btn2" onclick="pushCloud()">Nu synchroniseren</button><button class="btn2" onclick="disconnectSync()">Ontkoppelen</button></div></section>`}function status(m,k=''){syncMsg=m;syncKind=k;let e=document.querySelector('#syncstatus');if(e){e.textContent=m;e.className='small '+k}}
async function request(method,data){let c=cfg();if(!c)throw Error('Geen cloudkoppeling ingesteld.');let r=await fetch('/api/sync',{method,headers:{'content-type':'application/json','x-team-id':c.teamId,'x-sync-key':c.key},body:method==='PUT'?JSON.stringify(data):undefined}),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Cloudfout '+r.status);return j}
async function connectSync(){let team=document.querySelector('#syncTeam').value.trim(),key=document.querySelector('#syncKey').value.trim();if(!team||key.length<8)return status('Code minimaal 8 tekens','status-err');localStorage.setItem(SYNC,JSON.stringify({teamId:team,key}));status('Cloudgegevens ophalen');try{let j=await request('GET');if(j.bundle){if(confirm('Cloudgegevens gevonden. Lokale gegevens vervangen door de cloudversie?')){state=j.bundle.match||state;stats=j.bundle.stats||stats;localStorage.setItem(STORE,JSON.stringify(state));localStorage.setItem(STATS,JSON.stringify(stats));status('Cloudgegevens geladen','status-ok');render()}}else await pushCloud()}catch(e){if(String(e.message).includes('Nog geen'))await pushCloud();else status(e.message,'status-err')}}
async function pushCloud(){if(!cfg())return status('Geen cloudkoppeling','status-err');if(!navigator.onLine){localStorage.setItem(PENDING,'1');return status('Offline, wijziging in wachtrij')}status('Synchroniseren');try{let j=await request('PUT',bundle());localStorage.removeItem(PENDING);status('Gesynchroniseerd','status-ok')}catch(e){localStorage.setItem(PENDING,'1');status(e.message,'status-err')}}function scheduleSync(){if(!cfg())return;localStorage.setItem(PENDING,'1');clearTimeout(timer);timer=setTimeout(pushCloud,900)}function disconnectSync(){localStorage.removeItem(SYNC);localStorage.removeItem(PENDING);syncMsg='Alleen lokaal';render()}window.addEventListener('online',()=>{if(localStorage.getItem(PENDING)==='1')pushCloud()});render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
</script></body></html>
